name: liveness
description: A Flutter plugin for face verification and liveness detection using MobileFaceNet
  and ML Kit. Supports image-to-image and image-to-liveness comparison.
version: 1.3.0

environment:
  sdk: ^3.8.1
  flutter: ">=3.10.0"

# Add regular dependencies here.
dependencies:
  animate_do: ^5.1.0
  flutter:
    sdk: flutter
  camera: ^0.10.6
  image: ^4.1.3
  lottie: ^3.5.1
  path_provider: ^2.1.1
  # LiteRT (formerly TensorFlow Lite). A maintained fork of tflite_flutter
  # with the same Interpreter API; unlike tflite_flutter it supports Swift
  # Package Manager, and its pod needs no TensorFlowLiteSwift.
  flutter_litert: ^4.1.1
  google_mlkit_face_detection: ^0.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
  test: ^1.24.0

flutter:
  assets:
    - assets/models/facenet.tflite
    - assets/models/mobilefacenet.tflite
    - assets/blink.json
    - assets/mouth.json
    - assets/nod.json
    - assets/smile.json
    - assets/shake.json
    - assets/turn_left.json
    - assets/turn_right.json
