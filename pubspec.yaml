name: liveness
description: A Flutter plugin for face verification and liveness detection using MobileFaceNet
  and ML Kit. Supports image-to-image and image-to-liveness comparison.
version: 1.6.0

environment:
  # material_ui and cupertino_ui need Flutter 3.47 / Dart 3.13.
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Add regular dependencies here.
dependencies:
  animate_do: ^5.1.0
  flutter:
    sdk: flutter
  # 0.11 moved Android to camera_android_camerax, which converts streamed
  # frames to a single NV21 plane when asked, as camera_android did, so
  # the frame conversion works with either.
  camera: ">=0.10.6 <0.13.0"
  image: ^4.1.3
  lottie: ^3.5.1
  path_provider: ^2.1.1
  # LiteRT (formerly TensorFlow Lite). A maintained fork of tflite_flutter
  # with the same Interpreter API; unlike tflite_flutter it supports Swift
  # Package Manager, and its pod needs no TensorFlowLiteSwift.
  flutter_litert: ^4.1.1
  # 1.0 moved iOS to Swift Package Manager: the plugin ships only a
  # Package.swift, so apps must have SPM enabled (see the README).
  google_mlkit_face_detection: ^1.0.3
  # Flutter's Material and Cupertino libraries, now standalone packages
  # (package:flutter/material.dart and cupertino.dart are deprecated).
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
  test: ^1.24.0

flutter:
  assets:
    - assets/models/facenet.tflite
    - assets/models/mobilefacenet.tflite
    - assets/blink.json
    - assets/mouth.json
    - assets/nod.json
    - assets/smile.json
    - assets/shake.json
    - assets/turn_left.json
    - assets/turn_right.json
